name: ChargeGrid CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, user-service, discovery-service, session-service, billing-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # spotless:check is bound to the validate phase, so formatting is
      # enforced here before anything compiles.
      - name: Test service
        run: mvn --batch-mode test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: chargegrid
          POSTGRES_PASSWORD: chargegrid_dev
          POSTGRES_DB: chargegrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chargegrid"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:4
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create per-service databases
        env:
          PGPASSWORD: chargegrid_dev
        run: |
          psql -h localhost -U chargegrid -d chargegrid -c 'CREATE DATABASE chargegrid_discovery'
          psql -h localhost -U chargegrid -d chargegrid -c 'CREATE DATABASE chargegrid_sessions'
          psql -h localhost -U chargegrid -d chargegrid_discovery -c 'CREATE EXTENSION IF NOT EXISTS postgis'
      # CHARGEGRID_REQUIRE_INTEGRATION turns the "infrastructure unreachable"
      # skip into a failure, so these can never silently pass by not running.
      - name: discovery-service integration tests
        working-directory: services/discovery-service
        env:
          CHARGEGRID_REQUIRE_INTEGRATION: "true"
        run: mvn --batch-mode test
      - name: session-service integration tests
        working-directory: services/session-service
        env:
          CHARGEGRID_REQUIRE_INTEGRATION: "true"
          INTEGRATION_RABBITMQ_USER: guest
          INTEGRATION_RABBITMQ_PASSWORD: guest
        run: mvn --batch-mode test

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `kubectl apply --dry-run=client` still fetches the OpenAPI schema from an
      # API server, so with no cluster it fails on every file and validates
      # nothing. kubeconform checks the manifests against published Kubernetes
      # JSON schemas without needing a cluster.
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Validate manifests
        run: kubeconform -strict -summary -kubernetes-version 1.31.0 k8s/
