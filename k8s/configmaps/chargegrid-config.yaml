apiVersion: v1
kind: ConfigMap
metadata:
  name: chargegrid-config
  namespace: chargegrid
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: chargegrid
  # No shared DATABASE_URL: each service owns its schema and its own Flyway
  # history, so each Deployment sets its own database.
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  KEYCLOAK_URL: http://keycloak:8080
  KEYCLOAK_REALM: chargegrid
  API_GATEWAY_URL: http://api-gateway:8088
  DISCOVERY_SERVICE_URL: http://discovery-service:8082
  SESSION_SERVICE_URL: http://session-service:8083
  BILLING_SERVICE_URL: http://billing-service:8085
  NOTIFICATION_SERVICE_URL: http://notification-service:8086
