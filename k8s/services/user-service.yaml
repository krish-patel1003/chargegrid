apiVersion: apps/v1
kind: Deployment
metadata: {name: user-service, namespace: chargegrid}
spec:
  replicas: 2
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      containers:
        - name: user-service
          image: ghcr.io/chargegrid/user-service:__IMAGE_TAG__
          ports: [{name: http, containerPort: 8081}]
          envFrom: [{configMapRef: {name: chargegrid-config}}, {secretRef: {name: chargegrid-secrets}}]
          env:
            - {name: DATABASE_URL, value: "jdbc:postgresql://postgres:5432/chargegrid_users"}
          readinessProbe: {httpGet: {path: /actuator/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: user-service, namespace: chargegrid}
spec:
  type: ClusterIP
  selector: {app: user-service}
  ports: [{name: http, port: 8081, targetPort: http}]
