apiVersion: apps/v1
kind: Deployment
metadata: {name: session-service, namespace: chargegrid}
spec:
  replicas: 2
  selector: {matchLabels: {app: session-service}}
  template:
    metadata: {labels: {app: session-service}}
    spec:
      containers:
        - name: session-service
          image: ghcr.io/chargegrid/session-service:__IMAGE_TAG__
          ports: [{name: http, containerPort: 8083}]
          envFrom: [{configMapRef: {name: chargegrid-config}}, {secretRef: {name: chargegrid-secrets}}]
          readinessProbe: {httpGet: {path: /actuator/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: session-service, namespace: chargegrid}
spec:
  type: ClusterIP
  selector: {app: session-service}
  ports: [{name: http, port: 8083, targetPort: http}]
