apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: chargegrid}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/chargegrid/api-gateway:__IMAGE_TAG__
          ports: [{name: http, containerPort: 8088}]
          envFrom: [{configMapRef: {name: chargegrid-config}}, {secretRef: {name: chargegrid-secrets}}]
          readinessProbe: {httpGet: {path: /actuator/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: chargegrid}
spec:
  type: ClusterIP
  selector: {app: api-gateway}
  ports: [{name: http, port: 8088, targetPort: http}]
