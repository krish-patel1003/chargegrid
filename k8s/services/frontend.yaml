apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: chargegrid}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/chargegrid/frontend:__IMAGE_TAG__
          ports: [{name: http, containerPort: 80}]
          envFrom: [{configMapRef: {name: chargegrid-config}}, {secretRef: {name: chargegrid-secrets}}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: chargegrid}
spec:
  type: ClusterIP
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: http}]
