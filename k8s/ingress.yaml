apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chargegrid
  namespace: chargegrid
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: chargegrid.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api-gateway, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {name: http}}}
