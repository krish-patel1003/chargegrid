apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: chargegrid
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: redis}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: redis}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: chargegrid}
spec:
  type: ClusterIP
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
