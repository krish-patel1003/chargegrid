apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: chargegrid
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chargegrid
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          ports: [{name: postgres, containerPort: 5432}]
          envFrom:
            - configMapRef: {name: chargegrid-config}
            - secretRef: {name: chargegrid-secrets}
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: chargegrid-config, key: POSTGRES_DB}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chargegrid
spec:
  type: ClusterIP
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
