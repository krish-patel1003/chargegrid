apiVersion: apps/v1
kind: Deployment
metadata: {name: rabbitmq, namespace: chargegrid}
spec:
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: {secretKeyRef: {name: chargegrid-secrets, key: RABBITMQ_USER}}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: {secretKeyRef: {name: chargegrid-secrets, key: RABBITMQ_PASSWORD}}
          readinessProbe: {tcpSocket: {port: amqp}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: amqp}, initialDelaySeconds: 30, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: chargegrid}
spec:
  type: ClusterIP
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
