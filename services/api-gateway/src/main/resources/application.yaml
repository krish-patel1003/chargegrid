spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri is the value expected in the token's `iss` claim, which is
          # whatever hostname the *browser* used to sign in. jwk-set-uri is where
          # this service fetches signing keys, which in Docker is the internal
          # hostname. They differ, so they are configured separately rather than
          # letting issuer-uri drive discovery.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/chargegrid}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/chargegrid/protocol/openid-connect/certs}
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: discovery-service
              uri: ${DISCOVERY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/stations/**
            - id: session-service-reservations
              uri: ${SESSION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/reservations/**
            - id: session-service-sessions
              uri: ${SESSION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/sessions/**
            - id: session-service-admin
              uri: ${SESSION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/admin/**
            - id: billing-service
              uri: ${BILLING_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/billing/**

chargegrid:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info
