spring:
  application:
    name: billing-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chargegrid_billing}
    username: ${DATABASE_USERNAME:chargegrid}
    password: ${DATABASE_PASSWORD:chargegrid_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:chargegrid}
    password: ${RABBITMQ_PASSWORD:chargegrid_dev}

chargegrid:
  events:
    exchange: ${EVENTS_EXCHANGE:chargegrid.events}
    settlement-queue: ${SETTLEMENT_QUEUE:chargegrid.billing.settlement}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
