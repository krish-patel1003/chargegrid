spring:
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # See JwtDecoderConfig: the expected issuer is the browser-facing
          # Keycloak URL, while keys are fetched over the internal network.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/chargegrid}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/chargegrid/protocol/openid-connect/certs}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/chargegrid_users}
    username: ${DATABASE_USERNAME:chargegrid}
    password: ${DATABASE_PASSWORD:chargegrid_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
